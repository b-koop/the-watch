name: Vette comments (Claude Code)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: vette-claude-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # pull_request keeps fork code away from write-capable secrets.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - name: Skip when provider credentials are unavailable
        id: credentials
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "No Anthropic credential; skipping comment-only review."
            echo "Fork pull requests normally do not receive secrets."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      # The skill emits JSON; the shared boundary validates and posts it.
      # --permission-mode dontAsk plus the tool allowlist enforces the
      # comment-only contract at the harness level, not just in the prompt.
      - name: Review pull request and post comments only
        if: steps.credentials.outputs.available == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: >-
            /vette ${{ github.event.pull_request.number }} --comments-only
          claude_args: >-
            --allowedTools "Read,Grep,Glob,Bash,Workflow"
            --permission-mode dontAsk
